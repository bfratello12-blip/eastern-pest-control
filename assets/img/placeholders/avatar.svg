<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Customer avatar placeholder">
  <defs><pattern id="h" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="20" height="20" fill="#EDE9E5"/><rect width="10" height="20" fill="#E4DFD9"/></pattern></defs>
  <rect width="320" height="320" fill="url(#h)"/>
  <rect x="1.5" y="1.5" width="317" height="317" fill="none" stroke="#D3CBC3" stroke-width="3"/>
  <rect x="0" y="0" width="4" height="320" fill="#D21217"/>
  <text x="160" y="75" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="25" font-weight="700" letter-spacing="2.5" fill="#D21217">CUSTOMER AVATAR</text>
  <text x="160" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#6E655C">Square headshot pulled</text>
  <text x="160" y="156" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#6E655C">from the review</text>
  <text x="160" y="192" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#6E655C">platform, or supplied</text>
  <text x="160" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="24" fill="#6E655C">by the customer.</text>
  <text x="160" y="264" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="20" letter-spacing="2" fill="#A79C91">320 × 320</text>
</svg>
