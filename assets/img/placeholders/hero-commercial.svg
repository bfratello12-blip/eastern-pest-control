  <text x="1168" y="277" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#6E655C">Back of house at a real client</text>
  <text x="1168" y="340" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#6E655C">site — loading dock, prep kitchen</text>
  <text x="1168" y="403" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="42" fill="#6E655C">or warehouse aisle. Wide angle,</text>
