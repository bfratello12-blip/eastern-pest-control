  <text x="1168" y="193" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="4.8" fill="#D21217">PAGE HERO · SERVICES</text>
  <text x="1168" y="264" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#6E655C">Technician loading equipment from a</text>
  <text x="1168" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#6E655C">wrapped service truck at the branch.</text>
  <text x="1168" y="372" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#6E655C">Shoot wide and early. The left half</text>
  <text x="1168" y="426" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#6E655C">sits under a dark overlay carrying the</text>
  <text x="1168" y="480" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#6E655C">headline, so keep the action right of</text>
  <text x="1168" y="534" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="36" fill="#6E655C">centre.</text>
  <text x="1168" y="588" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="30" letter-spacing="2" fill="#A79C91">1600 × 640</text>
